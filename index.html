    <style>
        /* Less, but better */
        body {
            font-family: Helvetica, Arial, sans-serif;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
            padding: 2em;
            color: #000;
            background: #fff;
        }
        h1, h2, h3 {
            font-weight: normal;
        }
        a {

            margin: 4em 0;

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            grid-gap: 2em;
        }
